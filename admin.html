<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Contact Messages</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 20px;
            color: white;
        }

        .admin-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .admin-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .messages-grid {
            display: grid;
            gap: 20px;
        }

        .message-card {
            background: var(--bg-color);
            border-radius: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
        }

        .message-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .message-header {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .message-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .sender-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .sender-avatar {
            width: 40px;
            height: 40px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .sender-details h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .sender-details p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        .message-date {
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        .message-content {
            padding: 20px;
        }

        .message-text {
            line-height: 1.6;
            color: var(--text-color);
            margin-bottom: 15px;
        }

        .message-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-reply {
            background: var(--gradient);
            color: white;
        }

        .btn-reply:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-color);
            padding: 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1rem;
            color: var(--secondary-color);
        }

        .no-messages {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-color);
            border-radius: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .no-messages h3 {
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .no-messages p {
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 15px;
            }

            .admin-header h1 {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .message-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="loader"></div>
    </div>

    <header>
        <nav>
            <div class="nav-container">
                <div class="logo">Admin Panel</div>
                <ul class="nav-links">
                    <li><a href="index.html">← Back to Portfolio</a></li>
                </ul>
                <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
            </div>
        </nav>
    </header>

    <main>
        <div class="admin-container">
            <div class="admin-header">
                <h1>Contact Messages</h1>
                <p>Manage and respond to messages from your portfolio contact form</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="total-messages">0</div>
                    <div class="stat-label">Total Messages</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="unread-messages">0</div>
                    <div class="stat-label">Unread Messages</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="this-week">0</div>
                    <div class="stat-label">This Week</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="response-rate">0%</div>
                    <div class="stat-label">Response Rate</div>
                </div>
            </div>

            <div class="messages-grid" id="messages-container">
                <!-- Messages will be loaded here dynamically -->
                <div class="no-messages">
                    <h3>No messages yet</h3>
                    <p>Messages from your contact form will appear here once visitors start reaching out.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Theme toggle functionality (same as main site)
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        const currentTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
            themeToggle.setAttribute('aria-label', `Switch to ${theme === 'light' ? 'dark' : 'light'} mode`);
        }

        // Global messages array
        let messages = [];

        // Function to format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 1) {
                return 'Today';
            } else if (diffDays === 2) {
                return 'Yesterday';
            } else if (diffDays <= 7) {
                return `${diffDays - 1} days ago`;
            } else {
                return date.toLocaleDateString();
            }
        }

        // Function to get initials
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase();
        }

        // Function to render messages
        function renderMessages(messages) {
            const container = document.getElementById('messages-container');
            const totalMessages = document.getElementById('total-messages');
            const unreadMessages = document.getElementById('unread-messages');

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="no-messages">
                        <h3>No messages yet</h3>
                        <p>Messages from your contact form will appear here once visitors start reaching out.</p>
                    </div>
                `;
                totalMessages.textContent = '0';
                unreadMessages.textContent = '0';
                return;
            }

            const unreadCount = messages.filter(msg => !msg.read).length;

            totalMessages.textContent = messages.length;
            unreadMessages.textContent = unreadCount;

            container.innerHTML = messages.map(message => `
                <div class="message-card ${!message.read ? 'unread' : ''}" onclick="markAsRead(${message.id})">
                    <div class="message-header">
                        <div class="message-meta">
                            <div class="sender-info">
                                <div class="sender-avatar">${getInitials(message.name)}</div>
                                <div class="sender-details">
                                    <h3>${message.name}</h3>
                                    <p>${message.email}</p>
                                </div>
                            </div>
                            <div class="message-date">${formatDate(message.date)}</div>
                        </div>
                    </div>
                    <div class="message-content">
                        <div class="message-text">${message.message}</div>
                        <div class="message-actions">
                            <button class="btn-small btn-reply" onclick="event.stopPropagation(); replyToMessage('${message.email}', '${message.name}')" title="Reply via Email">
                                Reply
                            </button>
                            <button class="btn-small btn-delete" onclick="event.stopPropagation(); deleteMessage(${message.id})" title="Delete Message">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Function to reply to message
        function replyToMessage(email, name) {
            const subject = encodeURIComponent(`Re: Message from your portfolio`);
            const body = encodeURIComponent(`Hi ${name},\n\nThank you for reaching out through my portfolio. `);
            window.open(`mailto:${email}?subject=${subject}&body=${body}`);
        }

        // Function to mark message as read
        async function markAsRead(id) {
            try {
                const response = await fetch(`/api/messages/${id}/read`, {
                    method: 'PUT'
                });

                if (response.ok) {
                    // Update local message status
                    const message = messages.find(msg => msg.id === id);
                    if (message) {
                        message.read = true;
                        renderMessages(messages);
                    }
                }
            } catch (error) {
                console.error('Error marking message as read:', error);
            }
        }

        // Function to delete message
        async function deleteMessage(id) {
            if (confirm('Are you sure you want to delete this message?')) {
                try {
                    const response = await fetch(`/api/messages/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        // Reload messages after deletion
                        await loadMessages();
                    } else {
                        alert('Failed to delete message');
                    }
                } catch (error) {
                    console.error('Error deleting message:', error);
                    alert('Failed to delete message');
                }
            }
        }

        // Function to load messages from API
        async function loadMessages() {
            try {
                const response = await fetch('/api/messages');
                if (response.ok) {
                    messages = await response.json();
                    renderMessages(messages);
                } else {
                    console.error('Failed to load messages');
                    renderMessages([]);
                }
            } catch (error) {
                console.error('Error loading messages:', error);
                renderMessages([]);
            }
        }

        // Load messages on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadMessages();
        });

        // Loading screen
        window.addEventListener('load', function() {
            const loading = document.querySelector('.loading');
            if (loading) {
                setTimeout(() => {
                    loading.style.opacity = '0';
                    setTimeout(() => {
                        loading.style.display = 'none';
                    }, 500);
                }, 1000);
            }
        });
    </script>
</body>
</html>
