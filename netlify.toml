[build]
  publish = "."

# Route API calls to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Serve admin page and main page directly if requested
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

# Optional SPA fallback for other routes (keeps index working for /, /somepath)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
